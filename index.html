<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>豆豆的Party</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Noto+Sans+TC:wght@500;700;900&family=Iansui&display=swap">
<style>
/* Layout: HUD strip above a single 16:10 game canvas; overlays for start / end. Single committed party look (pastel wall, dark ink outlines). */
:root{
  --ink:#2a1f3d; --paper:#fff7ec; --pink:#ff7aa8; --mint:#5fd3b3; --sun:#ffc93c; --sky:#7cc4ff; --bad:#ff5a4f;
  --display:'Fredoka','Noto Sans TC',system-ui,sans-serif; --body:'Noto Sans TC',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:auto}
body{margin:0;background:#ffe3ef;color:var(--ink);font-family:var(--body);font-size:15px;
  padding-block:12px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:6px;align-items:stretch;background:#ffe3ef;padding-block:2px 6px}
.chip{flex:1 1 0;background:var(--paper);border:3px solid var(--ink);border-radius:12px;padding:3px 7px;min-width:0;box-shadow:0 3px 0 var(--ink);display:flex;flex-direction:row;align-items:center;justify-content:center;gap:6px}
.chip.sc{flex:1.45 1 0}.chip.sc small{letter-spacing:0}.chip.sc{justify-content:space-between;padding:2px 14px}#tm{letter-spacing:0;font-size:16px}
.chip.rk{flex:1.3 1 0}
.chip:first-child{flex:1.15 1 0}.chip:first-child small{display:none}
.tools{display:flex;gap:4px;align-items:center}
button.ic{font-size:16px;padding:0;width:34px;height:36px;border-radius:10px;border-width:2.5px;box-shadow:0 3px 0 var(--ink);background:var(--mint);line-height:1}
button.ic.quit{width:auto;padding:0 8px;font-size:12px;background:var(--sun);font-family:var(--body)}
button.ic.off{background:#d9d4e6;opacity:.6}
.chip small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10px;letter-spacing:.08em;opacity:.7;font-weight:700}
.chip b{white-space:nowrap;font-family:var(--display);font-size:19px;font-variant-numeric:tabular-nums;line-height:1.1}
.risk{height:12px;border:3px solid var(--ink);border-radius:9px;background:#fff;overflow:hidden;margin-top:4px}
.risk i{display:block;height:100%;width:0;background:var(--mint);transition:background .2s}
.stage{position:relative;border:4px solid var(--ink);border-radius:20px;overflow:hidden;box-shadow:0 6px 0 var(--ink);background:#ffd6e7;aspect-ratio:600/940;touch-action:none}
canvas{display:block;width:100%;height:100%}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(42,31,61,.55);padding:12px}
.card{background:var(--paper);border:4px solid var(--ink);border-radius:22px;padding:18px 20px;max-width:440px;width:100%;text-align:center;box-shadow:0 6px 0 var(--ink);display:flex;flex-direction:column;gap:10px;max-height:100%;overflow:auto}
.card h1,.card h2{margin:0;font-family:var(--display);font-size:30px;line-height:1.15;text-wrap:balance}
.card p{margin:0;line-height:1.5}
.card ul{margin:0;padding:0;list-style:none;text-align:left;font-size:14px;line-height:1.55;display:flex;flex-direction:column;gap:2px}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
button{font-family:var(--display);font-weight:700;font-size:18px;color:var(--ink);background:var(--sun);border:3px solid var(--ink);border-radius:14px;padding:10px 18px;box-shadow:0 4px 0 var(--ink);cursor:pointer}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
button:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
button.alt{background:var(--mint)}
button.sm{font-size:14px;padding:6px 12px;box-shadow:0 3px 0 var(--ink)}
.bar{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.hint{font-size:13px;opacity:.8;margin:0}
.pat{position:absolute;right:12px;bottom:12px;font-size:20px;padding:12px 20px;background:var(--bad);color:#fff}
@media (max-width:560px){.card h1,.card h2{font-size:24px}.card{padding:12px}.card ul{font-size:12.5px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
#dexView{text-align:center}#dexView canvas{width:100%;max-width:300px;aspect-ratio:3/2;border:3px solid var(--ink);border-radius:14px;background:#fff;display:block;margin:0 auto 6px}#dexView b{display:block;font-size:17px}#dexView small{opacity:.75}.dx:not(.lock){cursor:pointer}
#dexList{display:flex;flex-direction:column;gap:6px;text-align:left}
.dx{display:flex;align-items:center;gap:8px;border:3px solid var(--ink);border-radius:12px;padding:3px 8px;background:#fff}
.dx .em{font-size:22px;width:28px;text-align:center}.dx b{display:block;font-size:14px;line-height:1.2}.dx small{display:block;font-size:11px;opacity:.7;line-height:1.2}
.dx.lock{background:#e6e2ec;color:#8a85a0}.dx.lock .em{filter:grayscale(1);opacity:.6}
#dex .card{max-height:100%;overflow:auto;padding:10px 12px;gap:6px}#dex h2{font-size:22px}#dexList{gap:4px}
#epic{display:block;width:100%;max-width:300px;aspect-ratio:3/2;margin:0 auto 8px;border:3px solid var(--ink);border-radius:14px;background:#fff}
#end.alien{background:rgba(5,12,4,.85)}
#end.alien .card{background:linear-gradient(#2d3d22,#16240f);color:#d8ffb0;border-color:#0b1a07;box-shadow:0 6px 0 #0b1a07,0 0 30px rgba(120,230,60,.45);position:relative;padding-top:78px;overflow:visible}
#end.alien .card::before{content:"";position:absolute;left:-4px;right:-4px;top:-4px;height:34px;border-radius:22px 22px 0 0;background:#7be03c;border:4px solid #0b1a07;border-bottom:0}
#end.alien .card::after{content:"";position:absolute;left:-4px;right:-4px;top:28px;height:70px;pointer-events:none;background:radial-gradient(ellipse 12px 34px at 12% 0,#7be03c 98%,transparent),radial-gradient(ellipse 10px 46px at 34% 0,#7be03c 98%,transparent),radial-gradient(ellipse 13px 26px at 58% 0,#7be03c 98%,transparent),radial-gradient(ellipse 9px 40px at 78% 0,#7be03c 98%,transparent),radial-gradient(ellipse 12px 30px at 93% 0,#7be03c 98%,transparent);background-repeat:no-repeat}
#end.alien h2{color:#b6ff6a;text-shadow:0 2px 0 #0b1a07}
#end.alien button{background:#7be03c;color:#0b1a07;border-color:#0b1a07}
.ov.cover{background:transparent;align-items:flex-end;padding:12px}
.cover .card{padding:12px 14px;gap:8px}
details{text-align:left}
summary{cursor:pointer;font-weight:700;text-align:center;font-size:14px}
details ul{margin-top:8px}
/* fit the whole game in one screen: stage width follows the available height */
body{padding-block:6px}
.wrap{gap:6px}
.stage{margin:0 auto;border-width:3px;box-shadow:0 4px 0 var(--ink);width:min(100%,calc((100vh - 66px) * .6383));width:min(100%,calc((100dvh - 66px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)) * .6383))}
.top{gap:4px;padding-block:0 4px}
.chip{padding:2px 6px;border-width:2.5px;box-shadow:0 2px 0 var(--ink)}
button.ic{height:34px;box-shadow:0 2px 0 var(--ink)}
body.cover{padding:0;background:linear-gradient(#8fd8ff 0,#e4f7ff 40%,#78cc6c 62%,#5db55a 100%) no-repeat fixed #5db55a}
body.cover .stage{border:0;border-radius:0;box-shadow:none;width:min(100%,calc((100vh) * .6383));width:min(100%,calc((100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)) * .6383))}
</style>
<div class="wrap">
  <div class="top" id="top" hidden>
    <div class="chip"><small>時間</small><b id="tm">3:00</b></div>
    <div class="chip sc"><small>蛋糕數</small><b id="sc">0</b></div>
    <div class="tools">
      <button class="ic" id="mus" aria-label="背景音樂" title="背景音樂">🎵</button>
      <button class="ic" id="snd" aria-label="音效" title="音效">🔊</button>
      <button class="ic quit" id="quit" aria-label="結束遊戲">結束</button>
    </div>
  </div>
  <div class="stage" id="stage">
    <canvas id="cv" width="600" height="940"></canvas>
    <button class="pat" id="pat" hidden>拍背！</button>
    <div class="ov cover" id="start">
      <div class="card">
        <div class="btns">
          <button id="b5">限時 3 分鐘</button>
          <button id="bInf" class="alt">無限時</button>
        </div>
        <details>
          <summary>玩法說明</summary>
          <ul>
            <li>點擊蛋糕餵食豆豆</li>
            <li>不能吃的東西，往右滑推走</li>
            <li>隨機觸發小意外干擾吃蛋糕的豆豆</li>
            <li>豆豆：想辦法克服意外，沒人可以阻擋我吃蛋糕</li>
          </ul>
        </details>
      </div>
    </div>
    <div class="ov" id="dex" hidden>
      <div class="card">
        <h2>結局圖鑑</h2>
        <p id="dexCount"></p>
        <div id="dexList"></div>
        <div id="dexView" hidden><canvas id="dexPic" width="720" height="480"></canvas><b id="dexT"></b><small id="dexD"></small></div>
        <div class="btns"><button id="dexClose">返回</button></div>
      </div>
    </div>
    <div class="ov" id="end" hidden>
      <div class="card">
        <canvas id="epic" width="720" height="480"></canvas>
        <h2 id="etitle">時間到！</h2>
        <p id="etext"></p>
        <div class="btns"><button id="again">再玩一次</button></div>
      </div>
    </div>
  </div>
</div>

/* ---------- drawing helpers ---------- */
const W=600,H=940,INK='#2a1f3d';
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
ctx.lineJoin='round';ctx.lineCap='round';
function path(fn){ctx.beginPath();fn();}
function fs(fill,lw){if(fill){ctx.fillStyle=fill;ctx.fill();}ctx.lineWidth=lw||4;ctx.strokeStyle=INK;ctx.stroke();}
function ell(x,y,rx,ry,fill,lw,rot){path(()=>ctx.ellipse(x,y,rx,ry,rot||0,0,Math.PI*2));fs(fill,lw);}
function rr(x,y,w,h,r,fill,lw){path(()=>ctx.roundRect(x,y,w,h,r));fs(fill,lw);}

const BAL=['#ff7aa8','#ffc93c','#5fd3b3','#7cc4ff','#c59bff','#ff9a5c'];
const WORD='HAPPY BIRTHDAY';

/* ---------- the birthday kid (cartoon, original design from photo traits) ---------- */
function eyes(kind,tx){
  const ex=[455,505],ey=240;
  ctx.strokeStyle=INK;ctx.fillStyle=INK;
  ex.forEach((x,i)=>{

const Music=(()=>{
  const CH=[[261.6,329.6,392],[220,261.6,329.6],[174.6,220,261.6],[196,246.9,293.7]];
  const PENT=[523.3,587.3,659.3,784,880,1046.5],ARP=[0,1,2,1,2,1,2,1];
  const STEP=60/84/2;let on=true,timer=null,next=0,step=0;
  function note(f,t,dur,peak,type){
    const o=audio.createOscillator(),g=audio.createGain();o.type=type||'triangle';o.frequency.value=f;
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g);g.connect(musG);o.start(t);o.stop(t+dur+.05);
  }
  function sched(){
    if(!on||!audio)return;
    while(next<audio.currentTime+.25){
      const bar=(step>>3)%4,s=step&7,ch=CH[bar];
      note(ch[ARP[s]]*2,next,.7,.035,'triangle');
      if(s===0){note(ch[0]/2,next,1.6,.07,'sine');note(ch[1],next,1.4,.025,'sine');note(ch[2],next,1.4,.025,'sine');}
      if(s===4)note(ch[0]/2,next,1.0,.05,'sine');
      if((s===0||s===3||s===6)&&Math.random()<.65)note(PENT[(Math.random()*PENT.length)|0],next+(s===3?.02:0),.9,.03,'sine');
      next+=STEP;step++;
    }
  }
  return{
    get on(){return on;},
    start(){if(!on)return;try{ac();if(!timer){next=audio.currentTime+.1;step=0;timer=setInterval(sched,60);}}catch(e){}},
    toggle(){on=!on;if(on)this.start();else if(timer){clearInterval(timer);timer=null;}}
  };
})();

    if(f.ty==='heart'){for(let i=0;i<48;i++){const th=i/48*6.283,hx=16*Math.pow(Math.sin(th),3),hy=-(13*Math.cos(th)-5*Math.cos(2*th)-2*Math.cos(3*th)-Math.cos(4*th));P.push([hx,hy,i%2?f.c:'#ff6f9c',0,1]);}}
    P.forEach((q,i)=>{let x,y,x0,y0;

      const tw=.65+.35*Math.sin(r*34+i*1.7),A=al*(f.ty==='willow'?1:tw);
      ctx.strokeStyle=q[2];ctx.lineCap='round';ctx.globalAlpha=A*.55;ctx.lineWidth=2.4;ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x,y);ctx.stroke();
      ctx.fillStyle=q[2];ctx.globalAlpha=A;ctx.beginPath();ctx.arc(x,y,Math.max(0,3.4*(1-r/5)),0,7);ctx.fill();

  ctx.restore();}

  ctx.strokeStyle='rgba(255,240,210,.25)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-170,-150);ctx.lineTo(-120,-40);ctx.stroke();ctx.restore();
  ctx.save();ctx.translate(-70,-h/2+20);ctx.rotate(-.5);ctx.fillStyle='rgba(235,225,205,.7)';ctx.fillRect(-45,-18,90,36);ctx.restore();

  const L1='如果豆豆看到',L2='我就包個紅包給你';const w1=ctx.measureText(L1).width,w2=ctx.measureText(L2).width;
  ctx.strokeText(L1,-w2/2+38,-44);ctx.fillText(L1,-w2/2+38,-44);ctx.strokeText(L2,-w2/2,38);ctx.fillText(L2,-w2/2,38);
  {const ex=-w2/2+w2+22;ctx.fillStyle='#e01010';ctx.beginPath();ctx.moveTo(ex-9,-30);ctx.quadraticCurveTo(ex,-38,ex+9,-30);ctx.lineTo(ex+4,16);ctx.lineTo(ex-4,16);ctx.closePath();ctx.fill();ctx.beginPath();ctx.arc(ex,32,6,0,7);ctx.fill();}

}

function pos(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
cv.addEventListener('pointerdown',e=>{
  const p=pos(e);S.pointer=p;if(S.fin){finTap();return;}if(!S.running)return;try{cv.setPointerCapture(e.pointerId);}catch(_){}
  const d=S.dist;S.pdown=true;
  if(d&&d.ty==='meteor'&&d.cm){for(const m of d.cm){if(m.u>=1)continue;const[cx,cy]=cometPos(m);if(Math.hypot(p.x-cx,p.y-cy)<m.r+38){m.u=2;d.catch++;confetti(cx,cy,14);beep(900+d.catch*120,.12,'sine',.1);vib(30);
      if(d.catch>=d.need){S.dist=null;S.nextDist=gap();say('接住彗星了！隕石消失了',2);}else say('接住彗星！',.7);return;}}}
  if(d&&d.ty==='volcano'&&!d.sink&&d.t>2.5&&d.t<d.tE&&volcHit(p)){d.holding=true;d.hold=0;d.need=0;return;}
  if(d&&d.ty==='ufo'&&d.al&&(d.ph==='behind'||d.ph==='reach')&&!d.bindA){let best=null,bd=1e9;
    for(const a of d.al){const dd=Math.hypot(p.x-a.ax,p.y-(a.ay-150*a.as));if(dd<120*a.as+30&&dd<bd){bd=dd;best=a;}}
    if(best){const a=best;a.hp--;a.fl=.3;confetti(a.ax,a.ay-150*a.as,14);zapSfx();vib(40);
      if(a.hp<=0){d.al.splice(d.al.indexOf(a),1);if(!d.al.length){S.dist=null;S.nextDist=gap();say('擊退成功！外星人都消失了',1.8);}else say('擊退一隻！還有 '+d.al.length+' 隻',1.2);}
      else{const o=a.ax;let n;do{n=60+Math.random()*480;}while(Math.abs(n-o)<150);a.ax=n;a.tx=n;a.ax0=n;a.rz=Math.max(0,a.rz-.45);mkTs(a);a.tp=.4;confetti(n,a.ay-150*a.as,12);say('再一下！',.8);}
      return;}}
  if(d&&d.ty==='bubble'){for(let i=d.b.length-1;i>=0;i--){const b=d.b[i];if(Math.hypot(p.x-b.x,p.y-b.y)<b.r+6){d.b.splice(i,1);confetti(b.x,b.y,10);say('啵！',.5);beep(700+Math.random()*300,.08,'sine',.08);vib(25);
      if(!d.b.length){S.dist=null;S.nextDist=gap();say('泡泡全破了！',1);}return;}}}
  if(d&&d.ty==='fly'&&d.f){let bi=-1,bd=46;d.f.forEach((f,i)=>{const dd=Math.hypot(p.x-f.x,p.y-f.y);if(dd<bd){bd=dd;bi=i;}});
    if(bi>=0){const f=d.f.splice(bi,1)[0];d.swat=true;S.score+=5;S.stats.swats++;confetti(f.x,f.y,8);beep(180,.1,'square',.1);vib(30);
      if(!d.f.length){S.dist=null;S.nextDist=gap();S.score+=15;say('蒼蠅都拍掉了！',1.2);}else say('拍到了！還剩 '+d.f.length+' 隻',.7);return;}}
  if(d&&d.ty==='drone'&&d.ph!=='up'&&d.ph!=='out'&&(Math.hypot(p.x-d.x,p.y-d.y)<62||(d.bn>.3&&d.hw&&Math.abs(p.x-d.cx)<d.hw+8&&p.y>d.y+20&&p.y<d.y+40+d.bh))){d.ph='up';d.pt=0;S.stun=0;setMood('idle');beep(800,.08,'sine',.07);vib(25);say('無人機收起布條走了',1.2);return;}
  if(d&&(d.ty==='beauty'||d.ty==='moto'||d.ty==='car'||d.ty==='plane')&&p.x>170&&p.x<430&&p.y>130&&p.y<450){S.dist=null;S.nextDist=gap();S.stun=0;setMood('idle');say('回神！專心吃蛋糕',1.2);beep(500,.1,'square',.06);return;}
  if(S.mood==='choke'){if(p.x>100&&p.x<500&&p.y>110&&p.y<570)pat();return;}
  const it=S.cur;drag=null;
  if(it&&it.st==='ready'&&Math.hypot((p.x-it.x)/1.2,p.y-(PLATE_Y-40*it.s/2.6))<150)drag={it,x0:p.x,y0:p.y};
});
